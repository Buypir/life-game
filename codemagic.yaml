# Альтернатива GitHub Actions: 500 безкоштовних хвилин на місяць на Mac M2.
workflows:
  ios-unsigned:
    name: iOS (непідписаний IPA)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Build unsigned IPA
        script: ios/scripts/build-unsigned-ipa.sh
    artifacts:
      - LifeGame.ipa
