<main class="screen">
  @switch (screen()) {
    @case ('today') {
      <app-today />
    }
    @case ('todos') {
      <app-todos (openReminders)="go('reminders')" />
    }
    @case ('shop') {
      <app-shop />
    }
    @case ('progress') {
      <app-progress />
    }
    @case ('reminders') {
      <button type="button" class="link-btn back-btn" (click)="go('hero')">← Герой</button>
      <app-reminders />
    }
    @case ('hero') {
      <app-hero (openReminders)="go('reminders')" />
    }
  }
</main>

@if (award(); as text) {
  <div class="award" role="status">
    <span class="award-star" aria-hidden="true">★</span>
    <span>{{ text }}</span>
  </div>
}

@if (notice(); as text) {
  <div class="toast" role="status">
    <span>{{ text }}</span>
    <button type="button" (click)="notice.set(null); go('today')">Глянути</button>
  </div>
}

<nav class="nav" aria-label="Розділи">
  <button
    type="button"
    class="nav-item"
    [class.active]="screen() === 'today'"
    [attr.aria-current]="screen() === 'today' ? 'page' : null"
    (click)="go('today')"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon">
      <path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" />
    </svg>
    Сьогодні
  </button>
  <button
    type="button"
    class="nav-item"
    [class.active]="screen() === 'todos'"
    [attr.aria-current]="screen() === 'todos' ? 'page' : null"
    (click)="go('todos')"
  >
    <span class="nav-icon">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon">
        <path d="M9 6h11M9 12h11M9 18h11" />
        <path d="M4 5.5l1 1 2-2M4 11.5l1 1 2-2M4 17.5l1 1 2-2" />
      </svg>
      @if (todosBadge() > 0) {
        <span class="badge" aria-hidden="true">{{ todosBadge() }}</span>
      }
    </span>
    Справи
    @if (todosBadge() > 0) {
      <span class="sr-only">, на сьогодні {{ todosBadge() }}</span>
    }
  </button>
  <button
    type="button"
    class="nav-item"
    [class.active]="screen() === 'shop'"
    [attr.aria-current]="screen() === 'shop' ? 'page' : null"
    (click)="go('shop')"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon">
      <path d="M5 8h14l-1.2 11.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9z" />
      <path d="M9 10V7a3 3 0 0 1 6 0v3" />
    </svg>
    Магазин
  </button>
  <button
    type="button"
    class="nav-item"
    [class.active]="screen() === 'progress'"
    [attr.aria-current]="screen() === 'progress' ? 'page' : null"
    (click)="go('progress')"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon">
      <path d="M5 20V11M12 20V5M19 20v-6" />
    </svg>
    Прогрес
  </button>
  <button
    type="button"
    class="nav-item"
    [class.active]="screen() === 'hero' || screen() === 'reminders'"
    [attr.aria-current]="screen() === 'hero' ? 'page' : null"
    (click)="go('hero')"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon">
      <circle cx="12" cy="8" r="4" />
      <path d="M4.5 20c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5" />
    </svg>
    Герой
  </button>
</nav>
