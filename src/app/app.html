<main class="screen">
  @switch (screen()) {
    @case ('today') {
      <app-today />
    }
    @case ('todos') {
      <app-todos (openReminders)="go('reminders')" />
    }
    @case ('reminders') {
      <app-reminders />
    }
    @case ('hero') {
      <app-hero />
    }
  }
</main>

@if (notice(); as text) {
  <div class="toast" role="status">
    <span>{{ text }}</span>
    <button type="button" (click)="notice.set(null); go('today')">Глянути</button>
  </div>
}

<nav class="nav" aria-label="Розділи">
  <button
    type="button"
    class="nav-item"
    [class.active]="screen() === 'today'"
    [attr.aria-current]="screen() === 'today' ? 'page' : null"
    (click)="go('today')"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon">
      <path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" />
    </svg>
    Сьогодні
  </button>
  <button
    type="button"
    class="nav-item"
    [class.active]="screen() === 'todos'"
    [attr.aria-current]="screen() === 'todos' ? 'page' : null"
    (click)="go('todos')"
  >
    <span class="nav-icon">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon">
        <path d="M9 6h11M9 12h11M9 18h11" />
        <path d="M4 5.5l1 1 2-2M4 11.5l1 1 2-2M4 17.5l1 1 2-2" />
      </svg>
      @if (todosBadge() > 0) {
        <span class="badge" aria-hidden="true">{{ todosBadge() }}</span>
      }
    </span>
    Справи
    @if (todosBadge() > 0) {
      <span class="sr-only">, на сьогодні {{ todosBadge() }}</span>
    }
  </button>
  <button
    type="button"
    class="nav-item"
    [class.active]="screen() === 'reminders'"
    [attr.aria-current]="screen() === 'reminders' ? 'page' : null"
    (click)="go('reminders')"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon">
      <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z" />
      <path d="M10 20.5h4" />
    </svg>
    Нагадування
  </button>
  <button
    type="button"
    class="nav-item"
    [class.active]="screen() === 'hero'"
    [attr.aria-current]="screen() === 'hero' ? 'page' : null"
    (click)="go('hero')"
  >
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" class="icon">
      <circle cx="12" cy="8" r="4" />
      <path d="M4.5 20c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5" />
    </svg>
    Герой
  </button>
</nav>
